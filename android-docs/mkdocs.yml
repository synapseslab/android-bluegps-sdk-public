site_name: BlueGPS Android SDK
site_description: "BlueGPS Android SDK - Documentation"
site_author: Synapses srls.
site_dir: html
site_url: https://synapseslab.com/android-bluegps-sdk-public/
repo_url: https://github.com/synapseslab/android-bluegps-sdk-public
repo_name: synapseslab/android-bluegps-sdk-public
copyright: Copyright &copy; Synapses srl
# Keep the .html URLs already linked from README.md (the offline plugin used to force them)
use_directory_urls: false

nav:
  - 'Getting Started': index.md
  - 'Documentation': doc/doc.md
  - 'Changelog': changelog/changelog.md
  - 'API': api/index.html

theme:
  name: material
  logo: images/synapses-bluegps.png   # path relative to the docs/ folder
  favicon: images/favicon.ico  # optional
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - toc.integrate
    - navigation.expand
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      pygments_lang_class: true
      auto_title: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - md_in_html
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - css/custom.css