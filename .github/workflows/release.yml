name: Release

# Creates the GitHub release when a version tag is pushed, with the notes taken from the
# changelog. JitPack builds from the same tag on its own; this only publishes the release page.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  Release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tag must point at a commit that ships this version: otherwise JitPack builds one AAR
      # and the release announces another.
      - name: Check version files
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          grep -q -- "-Dversion=${VERSION} " jitpack.yml \
            || { echo "::error::jitpack.yml is not at version ${VERSION}"; exit 1; }
          grep -q -- "-Dfile=android-bluegps-sdk-${VERSION}.aar" jitpack.yml \
            || { echo "::error::jitpack.yml does not point at android-bluegps-sdk-${VERSION}.aar"; exit 1; }
          test -f "android-bluegps-sdk-${VERSION}.aar" \
            || { echo "::error::android-bluegps-sdk-${VERSION}.aar is missing"; exit 1; }
          grep -q "<version>${VERSION}</version>" pom.xml \
            || { echo "::error::pom.xml is not at version ${VERSION}"; exit 1; }

      # The section between "### Version X.Y.Z" and the next "### Version", minus the date line.
      - name: Extract release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^### Version " { if (found) exit; if ($3 == v) { found = 1; next } }
            found && $0 ~ "^\\*\\*[0-9/]+\\*\\*[[:space:]]*$" && !dated { dated = 1; next }
            found { print }
          ' android-docs/docs/changelog/changelog.md \
            | sed -e 's/[[:space:]]*$//' \
            | sed -e '/./,$!d' \
            | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no '### Version ${VERSION}' section in android-docs/docs/changelog/changelog.md"
            exit 1
          fi
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag
